<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | VibeCode</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="auth.css">

  <style>
    .not-found-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      position: relative;
      z-index: 10;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .not-found-code {
      font-family: 'Lora', serif;
      font-size: 7rem;
      font-weight: 700;
      line-height: 1;
      margin: 0;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .not-found-title {
      font-size: 1.8rem;
      margin-top: 12px;
      margin-bottom: 12px;
      color: var(--text-color, #ffffff);
    }
    .not-found-desc {
      color: #a1a1aa;
      max-width: 440px;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(99, 102, 241, 0.5);
    }
  </style>
</head>
<body>

  <!-- LIGHT/DARK THEME TOGGLE SWITCH -->
  <button class="theme-toggle-btn" id="themeToggle" type="button">
    <i class="fa-solid fa-moon" id="themeIcon"></i>
    <span id="themeLabel">Dark Theme</span>
  </button>

  <!-- GEOMETRIC ANIMATED BACKGROUND -->
  <div class="geo-container">
    <div class="geo-grid"></div>
    <div class="geo-shape geo-1"></div>
    <div class="geo-shape geo-2"></div>
    <div class="geo-shape geo-3"></div>
    <div class="geo-shape geo-4"></div>
  </div>

  <div class="not-found-container">
    <h1 class="not-found-code">404</h1>
    <h2 class="not-found-title">Page Not Found</h2>
    <p class="not-found-desc">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    <a href="index.html" class="home-btn"><i class="fa-solid fa-house"></i> Return to Home</a>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const themeToggle = document.getElementById('themeToggle');
      const themeIcon = document.getElementById('themeIcon');
      const themeLabel = document.getElementById('themeLabel');

      const savedTheme = localStorage.getItem('theme') || 'dark';
      applyTheme(savedTheme);

      themeToggle?.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        applyTheme(newTheme);
      });

      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        if (theme === 'dark') {
          if (themeIcon) themeIcon.className = 'fa-solid fa-moon';
          if (themeLabel) themeLabel.textContent = 'Dark Theme';
        } else {
          if (themeIcon) themeIcon.className = 'fa-solid fa-sun';
          if (themeLabel) themeLabel.textContent = 'Light Theme';
        }
      }
    });
  </script>
</body>
</html>
